
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calorie Track</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <div class="app">
    <header>
      <div class="logo">🔥 Calorie Track</div>
      <p class="subtitle">Your daily nutrition companion</p>
    </header>

    <main>
      <section class="card dashboard">
        <p class="eyebrow">DAILY OVERVIEW</p>
        <h1>Today's Calories</h1>
        <p id="todayDate"></p>

        <div class="calorie-ring">
          <div class="ring-content">
            <strong id="remaining">2000</strong>
            <span>kcal remaining</span>
          </div>
        </div>

        <div class="calorie-stats">
          <div><strong id="goal">2000</strong><span>Goal</span></div>
          <div><strong id="consumed">0</strong><span>Eaten</span></div>
        </div>
      </section>

      <section class="card">
        <h2>Macronutrients</h2>
        <div id="macros"></div>
      </section>

      <section class="card">
        <h2>Add Food</h2>
        <form id="foodForm">
          <label for="foodName">Food name</label>
          <input id="foodName" type="text" placeholder="e.g. Chicken breast" required maxlength="80">

          <div class="form-grid">
            <div>
              <label for="calories">Calories</label>
              <input id="calories" type="number" min="0" max="10000" step="0.1" required placeholder="kcal">
            </div>
            <div>
              <label for="protein">Protein (g)</label>
              <input id="protein" type="number" min="0" max="1000" step="0.1" required placeholder="0">
            </div>
            <div>
              <label for="carbs">Carbs (g)</label>
              <input id="carbs" type="number" min="0" max="1000" step="0.1" required placeholder="0">
            </div>
            <div>
              <label for="fat">Fat (g)</label>
              <input id="fat" type="number" min="0" max="1000" step="0.1" required placeholder="0">
            </div>
          </div>

          <label for="meal">Meal</label>
          <select id="meal">
            <option>Breakfast</option>
            <option>Lunch</option>
            <option>Dinner</option>
            <option>Snack</option>
          </select>

          <button type="submit" class="primary-btn">+ Add Food</button>
        </form>
      </section>

      <section class="card">
        <div class="section-heading">
          <h2>Food Diary</h2>
          <span id="foodCount">0 foods</span>
        </div>
        <div id="foodList"></div>
      </section>
    </main>

    <footer>Calorie Track · Version 1.0</footer>
  </div>
</body>
</html>
